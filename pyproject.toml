[project]
name = "genlayer-vulnerability-bounty"
version = "0.1.0"
description = "Autonomous Vulnerability Bounty Intelligent Contract for GenLayer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "genvm-linter>=0.11.0",
    "genlayer-test>=0.29.2",
    "genlayer-py>=0.16.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

